<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QdingOrder - 로그인</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-screen">
  <div class="logo">QdingOrder</div>
  <p style="font-size:0.85rem; color:var(--text-dim); margin-top:-10px; margin-bottom:8px;">노점상 QR 주문 시스템</p>

  <div class="login-box">
    <h2>오너 로그인</h2>

    <div class="form-group">
      <label class="form-label">이메일</label>
      <input type="email" id="emailInput" placeholder="owner@example.com" autocomplete="off">
    </div>

    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="new-password"
             onkeydown="if(event.key==='Enter') login()">
    </div>

    <div class="msg" id="msg" style="color:var(--danger); font-size:0.85rem; text-align:center; min-height:1.2em;"></div>

    <button class="btn btn-primary btn-block" id="loginBtn" onclick="login()">로그인</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://knwaqyeznxvhkmvqigaf.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud2FxeWV6bnh2aGttdnFpZ2FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDUxODUsImV4cCI6MjA5NzMyMTE4NX0.7WZwkIXnMxzCDvAy8JCRUp5ybXwFDQJc7GHfHhfXF_M'
  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_KEY)

  async function checkSession() {
    const { data: { session } } = await db.auth.getSession()
    if (session) window.location.href = 'dashboard.html'
  }

  async function login() {
    const email    = document.getElementById('emailInput').value.trim()
    const password = document.getElementById('passwordInput').value
    const btn      = document.getElementById('loginBtn')
    const msg      = document.getElementById('msg')

    if (!email || !password) { msg.textContent = '이메일과 비밀번호를 입력해주세요'; return }

    btn.disabled    = true
    btn.textContent = '로그인 중...'
    msg.textContent = ''

    const { data, error } = await db.auth.signInWithPassword({ email, password })

    if (error) {
      msg.textContent = '이메일 또는 비밀번호가 틀렸습니다'
      btn.disabled    = false
      btn.textContent = '로그인'
      return
    }

    // qr_owers 등록 여부 확인 → 없으면 자동 생성
    const { data: owner } = await db
      .from('qr_owers')
      .select('id')
      .eq('id', data.user.id)
      .single()

    if (!owner) {
      await db.from('qr_owers').insert({
        id: data.user.id,
        store_name: data.user.email,
        is_open: false
      })
    }

    // 메뉴 있으면 dashboard, 없으면 setup
    const { data: menuData } = await db
      .from('qr_menus')
      .select('id')
      .eq('owner_id', data.user.id)
      .limit(1)

    window.location.href = (menuData && menuData.length > 0) ? 'dashboard.html' : 'setup.html'
  }

  checkSession()
</script>
</body>
</html>
