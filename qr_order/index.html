<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QdingOrder</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

<div class="login-screen">

  <div class="logo">QdingOrder</div>
  <p style="font-size:0.85rem; color:var(--text-dim); margin-top:-10px; margin-bottom:8px;">
    노점상 QR 주문 시스템
  </p>

  <div class="login-box">
    <h2>오너 로그인</h2>

    <div class="form-group">
      <label class="form-label">이메일</label>
      <input type="email" id="email" placeholder="email@example.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="form-label">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password">
    </div>

    <p id="error-msg" class="error-msg" style="display:none;"></p>

    <button class="btn btn-primary btn-block" id="login-btn" onclick="handleLogin()">
      로그인
    </button>

    <button class="btn btn-ghost btn-block" onclick="toggleSignup()" id="toggle-btn">
      계정이 없으신가요? 회원가입
    </button>
  </div>

</div>

<script>
  let isSignup = false;

  // 이미 로그인된 경우 대시보드로
  (async () => {
    const user = await getUser();
    if (user) location.href = 'dashboard.html';
  })();

  // 엔터키 로그인
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });

  function toggleSignup() {
    isSignup = !isSignup;
    const box = document.querySelector('.login-box h2');
    const btn = document.getElementById('login-btn');
    const toggle = document.getElementById('toggle-btn');

    if (isSignup) {
      box.textContent = '회원가입';
      btn.textContent = '가입하기';
      toggle.textContent = '이미 계정이 있으신가요? 로그인';
    } else {
      box.textContent = '오너 로그인';
      btn.textContent = '로그인';
      toggle.textContent = '계정이 없으신가요? 회원가입';
    }
    hideError();
  }

  async function handleLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');

    if (!email || !password) {
      showError('이메일과 비밀번호를 입력해주세요.');
      return;
    }

    btn.disabled = true;
    btn.textContent = '처리중...';
    hideError();

    try {
      if (isSignup) {
        // 회원가입
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;

        // qr_owers 레코드 생성
        if (data.user) {
          await sb.from('qr_owers').insert({
            id: data.user.id,
            store_name: email.split('@')[0],
            is_open: false
          });
        }
        showError('가입 완료! 이메일을 확인하거나 바로 로그인해보세요.');
        toggleSignup();
      } else {
        // 로그인
        await signIn(email, password);
        location.href = 'dashboard.html';
      }
    } catch (err) {
      showError(err.message || '로그인에 실패했습니다.');
    } finally {
      btn.disabled = false;
      btn.textContent = isSignup ? '가입하기' : '로그인';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error-msg').style.display = 'none';
  }
</script>

</body>
</html>
