<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드 | QdingOrder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 탑바 -->
<div class="topbar">
  <div>
    <div class="logo">QdingOrder</div>
    <div class="store-name" id="store-name">로딩중...</div>
  </div>
  <div class="topbar-right">
    <!-- 영업 토글 -->
    <div class="toggle-wrap">
      <span class="toggle-label" id="open-label">마감</span>
      <label class="toggle">
        <input type="checkbox" id="open-toggle" onchange="setIsOpen(this.checked)">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <a href="setup.html" class="btn btn-ghost" style="padding:8px 14px; font-size:0.85rem;">메뉴설정</a>
    <button class="btn btn-ghost" style="padding:8px 14px; font-size:0.85rem;" onclick="logout()">로그아웃</button>
  </div>
</div>

<div class="main">

  <!-- 통계 -->
  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-submitted">0</div>
      <div class="stat-label">대기</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-confirmed">0</div>
      <div class="stat-label">준비중</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-done">0</div>
      <div class="stat-label">완료</div>
    </div>
  </div>

  <!-- 폴링 상태 -->
  <div style="display:flex; align-items:center; margin-bottom:12px;">
    <span class="polling-dot"></span>
    <span style="font-size:0.8rem; color:var(--text-dim);">실시간 주문 확인중</span>
    <a href="display.html?owner_id=" id="display-link" target="_blank"
       class="btn btn-ghost" style="margin-left:auto; padding:6px 12px; font-size:0.8rem;">
      📺 디스플레이
    </a>
  </div>

  <!-- 주문 목록 -->
  <div class="section-header">
    <span class="section-title">주문 목록</span>
    <span style="font-size:0.8rem; color:var(--text-dim);" id="order-date"></span>
  </div>

  <div id="order-list">
    <div class="spinner"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://knwaqyeznxvhkmvqigaf.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud2FxeWV6bnh2aGttdnFpZ2FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDUxODUsImV4cCI6MjA5NzMyMTE4NX0.7WZwkIXnMxzCDvAy8JCRUp5ybXwFDQJc7GHfHhfXF_M'
  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_KEY)

  let currentUser = null
  let orders = []
  let pollTimer = null
  let lastCount = 0

  // 날짜 표시
  const today = new Date()
  document.getElementById('order-date').textContent =
    `${today.getMonth()+1}/${today.getDate()} (${['일','월','화','수','목','금','토'][today.getDay()]})`

  ;(async () => {
    const { data: { session } } = await db.auth.getSession()
    if (!session) { window.location.href = 'index.html'; return }
    currentUser = session.user

    // 디스플레이 링크 설정
    document.getElementById('display-link').href = `display.html?owner_id=${currentUser.id}`

    await loadOwner()
    await loadOrders()
    startPolling()
  })()

  async function loadOwner() {
    const { data } = await db.from('qr_owers').select('*').eq('id', currentUser.id).single()
    if (!data) return
    document.getElementById('store-name').textContent = data.store_name || '내 가게'
    const toggle = document.getElementById('open-toggle')
    toggle.checked = data.is_open
    document.getElementById('open-label').textContent = data.is_open ? '영업중' : '마감'
  }

  async function setIsOpen(val) {
    await db.from('qr_owers').update({ is_open: val }).eq('id', currentUser.id)
    document.getElementById('open-label').textContent = val ? '영업중' : '마감'
    showToast(val ? '영업을 시작했어요 🟢' : '영업을 마감했어요 🔴')
  }

  async function loadOrders() {
    const todayStr = new Date().toISOString().slice(0, 10)
    const { data, error } = await db
      .from('qr_orders')
      .select('*')
      .eq('owner_id', currentUser.id)
      .gte('created_at', `${todayStr}T00:00:00`)
      .order('created_at', { ascending: false })

    if (error) return
    orders = data || []

    // 새 주문 알림
    const newCount = orders.filter(o => o.status === 'submitted').length
    if (newCount > lastCount && lastCount >= 0) beep()
    lastCount = newCount

    renderOrders()
    updateStats()
  }

  function renderOrders() {
    const el = document.getElementById('order-list')
    const active = orders.filter(o => o.status !== 'done')
    const done   = orders.filter(o => o.status === 'done')
    const sorted = [...active, ...done]

    if (sorted.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div><p>아직 주문이 없어요</p></div>`
      return
    }

    const cards = sorted.map(o => {
      const itemText = o.items.map(i => `${i.name} ${i.qty}개`).join(', ')
      const time = new Date(o.created_at).toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' })

      let btn = ''
      if      (o.status === 'submitted') btn = `<button class="btn btn-blue order-card-btn"    onclick="updateStatus('${o.id}','confirmed')">승인</button>`
      else if (o.status === 'confirmed') btn = `<button class="btn btn-warn order-card-btn"    onclick="updateStatus('${o.id}','ready')">호출</button>`
      else if (o.status === 'ready')     btn = `<button class="btn btn-primary order-card-btn" onclick="updateStatus('${o.id}','done')">완료</button>`

      return `
        <div class="order-card ${o.status}">
          <div class="order-card-num ${o.status === 'ready' ? 'ready' : ''}">${o.order_number}</div>
          <div class="order-card-info">
            <span class="status-badge ${o.status}">${statusLabel(o.status)}</span>
            <div class="order-card-items">${itemText}</div>
            <div class="order-card-total">${o.total_price.toLocaleString()}원</div>
            <div class="order-card-time">${time}</div>
          </div>
          <div class="order-card-actions">${btn}</div>
        </div>`
    }).join('')

    // 하단 합계 + 삭제
    const totalSum = orders.reduce((s, o) => s + o.total_price, 0)
    const footer = `
      <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
                  padding:14px 16px; margin-top:8px; display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-size:0.8rem; color:var(--text-dim); margin-bottom:2px;">오늘 총 매출</div>
          <div style="font-size:1.2rem; font-weight:800; color:var(--accent);">${totalSum.toLocaleString()}원</div>
        </div>
        <button class="btn btn-danger" style="padding:8px 16px; font-size:0.85rem;" onclick="clearOrders()">
          🗑️ 목록 삭제
        </button>
      </div>`

    el.innerHTML = cards + footer
  }

  function updateStats() {
    document.getElementById('stat-submitted').textContent = orders.filter(o => o.status === 'submitted').length
    document.getElementById('stat-confirmed').textContent = orders.filter(o => o.status === 'confirmed' || o.status === 'ready').length
    document.getElementById('stat-done').textContent      = orders.filter(o => o.status === 'done').length
  }

  async function updateStatus(id, status) {
    const { error } = await db.from('qr_orders').update({ status }).eq('id', id)
    if (error) { showToast('변경 실패: ' + error.message); return }
    const o = orders.find(o => o.id === id)
    if (o) o.status = status
    renderOrders()
    updateStats()

    const labels = { confirmed:'승인됐어요 ✅', ready:'호출했어요 🔔', done:'완료됐어요 👍' }
    showToast(labels[status] || '')
  }

  async function clearOrders() {
    if (!confirm('오늘 주문 목록을 모두 삭제할까요?')) return
    const todayStr = new Date().toISOString().slice(0, 10)
    const { error } = await db
      .from('qr_orders')
      .delete()
      .eq('owner_id', currentUser.id)
      .gte('created_at', todayStr + 'T00:00:00')
    if (error) { showToast('삭제 실패: ' + error.message); return }
    orders = []
    renderOrders()
    updateStats()
    showToast('주문 목록이 삭제됐어요 🗑️')
  }

  function statusLabel(status) {
    return { submitted:'대기중', confirmed:'준비중', ready:'호출', done:'완료' }[status] || status
  }

  function startPolling() {
    pollTimer = setInterval(loadOrders, 3000)
  }

  function logout() {
    clearInterval(pollTimer)
    db.auth.signOut().then(() => { window.location.href = 'index.html' })
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)()
      const osc = ctx.createOscillator()
      const gain = ctx.createGain()
      osc.connect(gain)
      gain.connect(ctx.destination)
      osc.frequency.value = 880
      gain.gain.setValueAtTime(0.3, ctx.currentTime)
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4)
      osc.start(ctx.currentTime)
      osc.stop(ctx.currentTime + 0.4)
    } catch(e) {}
  }

  function showToast(msg) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.classList.add('show')
    setTimeout(() => el.classList.remove('show'), 2500)
  }
</script>

</body>
</html>
