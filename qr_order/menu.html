<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문하기 | QdingOrder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div>
    <div class="logo">QdingOrder</div>
    <div class="store-name" id="store-name">로딩중...</div>
  </div>
  <div id="open-badge" style="display:none;">
    <span class="status-badge done">영업중</span>
  </div>
</div>

<div class="container-sm" style="padding-top:16px;">
  <div class="closed-banner" id="closed-banner" style="display:none;">🚫 현재 영업 준비중이에요</div>

  <div class="section-header">
    <span class="section-title">메뉴</span>
  </div>
  <div id="menu-list"><div class="spinner"></div></div>

  <div id="summary-section" style="display:none;">
    <div class="section-header" style="margin-top:8px;">
      <span class="section-title">주문 내역</span>
    </div>
    <div class="order-summary" id="order-summary"></div>
  </div>

  <div style="height:80px;"></div>
</div>

<div class="bottom-bar" id="bottom-bar" style="display:none;">
  <button class="btn btn-primary btn-block" id="order-btn" onclick="submitOrder()">주문하기</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://knwaqyeznxvhkmvqigaf.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtud2FxeWV6bnh2aGttdnFpZ2FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3NDUxODUsImV4cCI6MjA5NzMyMTE4NX0.7WZwkIXnMxzCDvAy8JCRUp5ybXwFDQJc7GHfHhfXF_M'
  const { createClient } = supabase
  const db = createClient(SUPABASE_URL, SUPABASE_KEY)

  const ownerId = new URLSearchParams(location.search).get('owner_id')
  let menus = []
  let qty   = {}

  if (!ownerId) {
    document.body.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;">
        <div class="logo">QdingOrder</div>
        <p style="color:var(--text-dim);">올바른 QR 코드를 스캔해주세요.</p>
      </div>`
  } else {
    init()
  }

  async function init() {
    try {
      const { data: owner, error } = await db.from('qr_owers').select('*').eq('id', ownerId).single()
      if (error || !owner) throw new Error('가게 정보 없음')

      document.getElementById('store-name').textContent = owner.store_name || '주문하기'

      if (!owner.is_open) {
        document.getElementById('closed-banner').style.display = 'block'
        document.getElementById('menu-list').innerHTML = ''
        return
      }

      document.getElementById('open-badge').style.display = 'block'

      const { data: menuData } = await db
        .from('qr_menus').select('*')
        .eq('owner_id', ownerId)
        .eq('is_available', true)
        .order('sort_order', { ascending: true })

      menus = menuData || []
      renderMenus()
    } catch (e) {
      document.getElementById('menu-list').innerHTML =
        `<div class="empty-state"><div class="empty-icon">⚠️</div><p>가게 정보를 불러올 수 없어요</p></div>`
    }
  }

  function renderMenus() {
    const el = document.getElementById('menu-list')
    if (menus.length === 0) {
      el.innerHTML = `<div class="empty-state"><div class="empty-icon">🍽️</div><p>등록된 메뉴가 없어요</p></div>`
      return
    }
    el.innerHTML = menus.map(m => `
      <div class="menu-item">
        <div class="menu-item-info">
          <div class="menu-item-name">${m.name}</div>
          <div class="menu-item-price">${m.price.toLocaleString()}원</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn minus" onclick="changeQty('${m.id}',-1)">−</button>
          <span class="qty-number" id="qty-${m.id}">0</span>
          <button class="qty-btn plus"  onclick="changeQty('${m.id}',1)">+</button>
        </div>
      </div>
    `).join('')
  }

  function changeQty(id, delta) {
    qty[id] = Math.max(0, (qty[id] || 0) + delta)
    document.getElementById(`qty-${id}`).textContent = qty[id]
    updateSummary()
  }

  function updateSummary() {
    const items = menus.filter(m => qty[m.id] > 0).map(m => ({ ...m, qty: qty[m.id] }))
    const total = items.reduce((s, i) => s + i.price * i.qty, 0)
    const hasItems = items.length > 0

    document.getElementById('summary-section').style.display = hasItems ? 'block' : 'none'
    document.getElementById('bottom-bar').style.display      = hasItems ? 'block' : 'none'

    if (hasItems) {
      document.getElementById('order-summary').innerHTML = `
        ${items.map(i => `
          <div class="order-summary-row">
            <span>${i.name} × ${i.qty}</span>
            <span>${(i.price * i.qty).toLocaleString()}원</span>
          </div>`).join('')}
        <div class="order-summary-total">
          <span>합계</span>
          <span class="order-summary-total-price">${total.toLocaleString()}원</span>
        </div>`
      document.getElementById('order-btn').textContent = `주문하기 · ${total.toLocaleString()}원`
    }
  }

  async function submitOrder() {
    const items = menus.filter(m => qty[m.id] > 0).map(m => ({ name: m.name, price: m.price, qty: qty[m.id] }))
    if (items.length === 0) return

    const btn = document.getElementById('order-btn')
    btn.disabled    = true
    btn.textContent = '주문 중...'

    try {
      const totalPrice = items.reduce((s, i) => s + i.price * i.qty, 0)
      const today = new Date().toISOString().slice(0, 10)

      const { data: maxData } = await db
        .from('qr_orders').select('order_number')
        .eq('owner_id', ownerId)
        .gte('created_at', `${today}T00:00:00`)
        .order('order_number', { ascending: false })
        .limit(1)

      const orderNumber = (maxData && maxData.length > 0) ? maxData[0].order_number + 1 : 1

      const { data, error } = await db.from('qr_orders').insert({
        owner_id: ownerId, items, total_price: totalPrice,
        order_number: orderNumber, status: 'submitted'
      }).select().single()

      if (error) throw error
      location.href = `order.html?order_id=${data.id}`

    } catch (e) {
      btn.disabled    = false
      updateSummary()
      showToast('주문 실패: ' + e.message)
    }
  }

  function showToast(msg) {
    const el = document.getElementById('toast')
    el.textContent = msg
    el.classList.add('show')
    setTimeout(() => el.classList.remove('show'), 2500)
  }
</script>

</body>
</html>
